<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" role="img" aria-label="Kultury bakteryjne według typu. Liczba kultur bakteryjnych według typu w bazie 188 pozycji. Mezofilne: 36, Mezofilno-termofilne: 30, Termofilne: 26, Jogurtowe: 21, Pleśniowe: 21, Aromatyzujące: 16, Kefir: 13, Probiotyczne: 7." style="max-width:720px;height:auto">
